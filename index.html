<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mensaje de Amistad</title>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: #333;
            text-align: center;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 20px;
            color: #fff;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.2);
        }

        #friendButton {
            padding: 15px 30px;
            font-size: 1.2rem;
            color: #fff;
            background-color: #4a90e2;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.3s;
        }

        #friendButton:hover {
            background-color: #357abd;
            transform: scale(1.05);
        }

        #friendButton:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>
    <div>
        <h1>Haz Click en el Boton para ver el Mensaje</h1>
        <button id="friendButton">Mostrar Mensaje</button>
    </div>

    <script>
        document.getElementById('friendButton').addEventListener('click', function() {
            Swal.fire({
                title: 'Amistad',
                text: 'La Amistad es un tesoro invaluable ¡Gracias por ser mi amigo!',
                icon: 'success',
                confirmButtonText: 'Cerrar'
            });
        });
    </script>
</body>
</html>
